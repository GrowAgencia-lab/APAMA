<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APAMA · Propuestas de auspicio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/*
VOICE: academia deportiva con orgullo, cálida y prolija; brochure que se edita como papel.
IDEA: el brochure impreso A4 de APAMA, hoja por hoja, que se escribe encima.
PICTURE: las fotos reales del plantel y la silueta de la patinadora como sello.
COLOUR and TYPE: fucsia APAMA dominante, rosa claro de apoyo, dorado solo para los 20 años; Montserrat.
LAYOUT: barra de herramientas arriba, panel lateral de datos, hojas A4 apiladas al centro.
*/
:root{--f:#E5177F;--f2:#C10F68;--rosa:#FCE3EF;--rosa2:#F7C3DC;--ink:#2A1621;--gris:#6E5B66;--oro:#B8902F;--bg:#F4EEF1;--line:#E8DCE2;color-scheme:light}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 Montserrat,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hide{display:none!important}

/* ---------- UI general ---------- */
.top{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:8px max(2vw,12px);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;color:var(--f);margin-right:auto;font-size:17px}
.brand img{height:34px}
.brand small{display:block;color:var(--gris);font-weight:500;font-size:12px}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;min-height:42px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--f)}
.btn.p{background:var(--f);border-color:var(--f);color:#fff}
.btn.p:hover{background:var(--f2)}
.btn.wa{background:#1FA855;border-color:#1FA855;color:#fff}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px}
.btn.dang{color:#B3261E}
.btn:focus-visible,input:focus-visible,select:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--f);outline-offset:2px}
.demo{background:#FFF4D6;color:#6B4E00;font-size:13px;padding:7px max(2vw,12px);border-bottom:1px solid #F0DFA8}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;z-index:99;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* login / home */
.wrap{max-width:1080px;margin:0 auto;padding:28px max(4vw,16px)}
.login{max-width:380px;margin:12vh auto;background:#fff;border-radius:18px;padding:32px;text-align:center;box-shadow:0 10px 40px #c10f6820}
.login img{height:90px}
.login h1{color:var(--f);margin:10px 0 4px;font-size:24px}
.field{display:block;text-align:left;margin:12px 0}
.field span{display:block;font-size:12.5px;font-weight:600;color:var(--gris);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;background:#fff}
.home-h{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:18px}
.home-h h1{margin:0;font-size:28px;line-height:1.1;margin-right:auto}
.home-h h1 b{color:var(--f);display:block}
.search{flex:1 1 220px;max-width:340px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px}
.list{display:grid;gap:10px}
.item{background:#fff;border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line)}
.item h3{margin:0;font-size:16px}
.item .meta{font-size:13px;color:var(--gris)}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:20px;background:var(--rosa);color:var(--f2);margin-right:4px}
.tag.v{background:#DDF5E5;color:#17663A}
.tag.n{background:#EEE;color:#666}
.empty{background:#fff;border:2px dashed var(--rosa2);border-radius:16px;padding:40px;text-align:center;color:var(--gris)}
@media(max-width:700px){.item{grid-template-columns:1fr}.item .acts{justify-content:flex-start}}

/* editor */
.ed{display:grid;grid-template-columns:330px minmax(0,1fr);align-items:start}
.side{position:sticky;top:59px;height:calc(100vh - 59px);overflow:auto;background:#fff;border-right:1px solid var(--line);padding:14px 16px 40px}
.side h4{margin:18px 0 6px;font-size:13px;color:var(--f2);text-transform:none;border-top:1px solid var(--line);padding-top:14px}
.side h4:first-child{border:0;padding-top:0;margin-top:0}
.side .field{margin:8px 0}
.side .field input,.side .field select,.side .field textarea{padding:8px 10px;font-size:15px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--f)}
.hint{font-size:12px;color:var(--gris);margin:4px 0}
.pages{padding:24px max(3vw,14px) 120px;display:flex;flex-direction:column;align-items:center;gap:26px}
@media(max-width:600px){.top{gap:6px;padding:6px 10px}.top .btn{min-height:36px;padding:5px 10px;font-size:13px}.brand{font-size:15px}.brand img{height:26px}}
@media(max-width:900px){.ed{grid-template-columns:1fr}.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}}

/* ---------- HOJA A4 ---------- */
.sheet{width:min(100%,820px);aspect-ratio:210/297;background:#fff;position:relative;overflow:hidden;container-type:inline-size;box-shadow:0 6px 30px #2a162118;font-size:calc(1.6cqw*var(--k,1));line-height:1.5;color:var(--ink)}
.sheet.off{display:none}
.editing .sheet.over{outline:3px solid #E53935}
.editing .sheet.over::after{content:"El contenido no entra en la hoja: acortá el texto";position:absolute;top:0;left:0;right:0;background:#E53935;color:#fff;font-size:13px;padding:4px 10px;z-index:9;font-weight:600}
.pad{position:absolute;inset:6.5cqw 7cqw 9cqw}
.foot{position:absolute;left:7cqw;right:7cqw;bottom:3.2cqw;display:flex;justify-content:space-between;font-size:calc(1.35cqw*var(--k,1));color:var(--gris);border-top:.15cqw solid var(--rosa2);padding-top:1cqw}
.ttl{font-size:calc(5.4cqw*var(--k,1));line-height:1.02;font-weight:600;margin:0 0 2.2cqw;color:var(--ink)}
.ttl b{display:block;color:var(--f);font-weight:800}
.ttl.r{text-align:right}
.txt{margin:0 0 1.6cqw;white-space:pre-line;text-align:justify;hyphens:auto}
.ph{background:#eee center/cover no-repeat;position:relative;border-radius:1.6cqw}
.chg{position:absolute;right:1cqw;top:1cqw;z-index:5;background:#fffffff0;border:0;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;color:var(--f2);box-shadow:0 2px 8px #0003}
.cap{position:absolute;left:0;bottom:0;background:var(--f);color:#fff;font-weight:600;padding:.8cqw 2.4cqw;border-radius:0 1.6cqw 0 1.6cqw;font-size:calc(1.6cqw*var(--k,1))}
.ul{margin:0;padding:0;list-style:none}
.ul li{position:relative;padding-left:2.4cqw;margin:.55cqw 0}
.ul li::before{content:"";position:absolute;left:0;top:.62em;width:1.1cqw;height:1.1cqw;border-radius:50%;background:var(--f)}
.x,.add{border:0;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;line-height:1.4}
.x{background:#fde7ee;color:#B3261E;margin-left:4px;padding:0 5px;vertical-align:middle}
.sc,.w>div,.rb,.fd,.bar,.chip,.pgrid>div,.plan{position:relative}
.sc>.x,.w .x,.rb>.x,.fd>.x,.bar>.x,.pgrid .x{position:absolute;top:-.4cqw;right:-.4cqw;margin:0}
.measure .x,.measure .add,.measure .chg,.measure .qp{display:none!important}
.ul li>.x{position:absolute;right:-.6cqw;top:-1.1em;margin:0;padding:0;width:22px;height:22px;font-size:11px;display:none;align-items:center;justify-content:center;box-shadow:0 1px 4px #0004;z-index:4}
.editing .ul li:focus-within>.x,.editing .ul li:hover>.x{display:flex}
.qp{position:absolute;top:.8cqw;right:.8cqw}.qp .x{margin:0}
.add{font-size:max(10px,1.3cqw)!important;padding:.3em .8em!important}
.add{background:var(--rosa);color:var(--f2);padding:4px 10px;margin-top:4px}
[data-p]{white-space:pre-line}
.editing [data-p]{outline:1px dashed transparent;border-radius:3px;transition:outline-color .15s}
.editing [data-p]:hover{outline-color:var(--rosa2)}
.editing [data-p]:empty::before{content:"Escribí aquí…";color:#bbb}
.view .x,.view .add,.view .chg{display:none}
.view .emp{display:none}

/* portada */
.pg-cov .bg{position:absolute;left:0;right:0;top:0;bottom:30%;border-radius:0;background-position:center 80%}
.cov-band{position:absolute;left:0;right:0;bottom:0;height:43%;background:linear-gradient(160deg,#EE3D97,var(--f) 55%,var(--f2));clip-path:polygon(0 22%,100% 0,100% 100%,0 100%);color:#fff;padding:14cqw 7cqw 6cqw}
.cov-logo{position:absolute;right:7cqw;bottom:13cqw;height:27cqw}
.cov-k{font-size:calc(1.9cqw*var(--k,1));font-weight:600;letter-spacing:.02em;margin:0;opacity:.95}
.cov-t{font-size:calc(12.5cqw*var(--k,1));font-weight:800;line-height:.95;margin:.6cqw 0 1.2cqw;letter-spacing:-.02em}
.cov-s{font-size:calc(2.5cqw*var(--k,1));font-weight:400;margin:0;max-width:62%}
.cov-for{margin-top:3.2cqw;display:inline-block;background:#fff;color:var(--f2);border-radius:10cqw;padding:1.2cqw 3cqw;font-weight:700;font-size:calc(1.9cqw*var(--k,1))}
.cov-20{position:absolute;top:5cqw;right:5cqw;width:19cqw;height:19cqw;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F3D98A,var(--oro) 70%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 1cqw 3cqw #0004;padding:2cqw}
.cov-20 b{font-size:calc(6.4cqw*var(--k,1));line-height:1;font-weight:800}
.cov-20 span{font-size:calc(1.45cqw*var(--k,1));font-weight:600;line-height:1.2}

/* quiénes */
.q-grid{display:grid;grid-template-columns:1fr 1fr;gap:5cqw}
.q-tri{position:absolute;left:0;right:0;bottom:0;height:40%;background:var(--f);clip-path:polygon(0 35%,100% 0,100% 100%,0 100%)}
.q-img{position:absolute;left:4cqw;right:0;bottom:7cqw;height:38%;background:transparent center bottom/contain no-repeat;border-radius:0}

/* logros */
.big{height:42cqw;margin:2cqw 0 3cqw}
.chips{display:flex;flex-wrap:wrap;gap:1.2cqw;margin:1cqw 0 2.5cqw}
.chip{background:var(--rosa);color:var(--f2);font-weight:700;border-radius:6cqw;padding:.8cqw 2.2cqw;font-size:calc(1.6cqw*var(--k,1))}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:2.4cqw}
.duo .ph{height:30cqw}

/* datos */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1.6cqw;margin:2cqw 0 3cqw}
.st{background:var(--rosa);border-radius:1.6cqw;padding:2.4cqw 1.6cqw;text-align:center}
.st b{display:block;font-size:calc(5.2cqw*var(--k,1));line-height:1;color:var(--f);font-weight:800}
.st span{font-size:calc(1.5cqw*var(--k,1));font-weight:600}
.dat{display:grid;grid-template-columns:40% 1fr;gap:4cqw;align-items:start}
.dat .ph{height:52cqw}
.bars h5{margin:0 0 1.6cqw;font-size:calc(2cqw*var(--k,1))}
.bar{margin:0 0 2cqw}
.bar .l{display:flex;justify-content:space-between;font-weight:600;font-size:calc(1.6cqw*var(--k,1))}
.bar .t{height:2.6cqw;background:var(--rosa);border-radius:2cqw;overflow:hidden;margin-top:.6cqw}
.bar .t i{display:block;height:100%;background:linear-gradient(90deg,var(--f),#F25BA8);border-radius:2cqw}
.quote{background:var(--f);color:#fff;border-radius:2cqw;padding:3cqw 4cqw;font-size:calc(2.1cqw*var(--k,1));font-weight:500;text-align:center;margin-top:3cqw}

/* staff */
.staff-top{position:absolute;left:0;right:0;top:0;height:30%;border-radius:0;background-position:center 30%}
.staff-pad{top:calc(30% + 3.5cqw)}
.sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:2cqw 2.4cqw;margin-top:1.6cqw}
.sc .ph{aspect-ratio:1/1;background-position:center 15%;border-radius:1.4cqw;clip-path:polygon(0 0,82% 0,100% 15%,100% 100%,0 100%)}
.sc .ph::after{content:"";position:absolute;left:0;bottom:0;width:45%;height:55%;background:var(--f);opacity:.85;clip-path:polygon(0 0,100% 100%,0 100%)}
.sc h6{margin:1cqw 0 0;color:var(--f);font-size:calc(1.85cqw*var(--k,1));font-weight:700;line-height:1.15}
.sc p{margin:.3cqw 0 0;font-size:calc(1.35cqw*var(--k,1));color:var(--gris);line-height:1.3}

/* infra */
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:2.2cqw;margin-top:1cqw}
.igrid .ph{height:27cqw}
.igrid .cap{font-size:calc(1.4cqw*var(--k,1));right:0;border-radius:0 0 1.6cqw 1.6cqw;background:#c10f68e6;font-weight:500;padding:.8cqw 1.6cqw}

/* festival */
.pg-fest{background:#1d0f17;color:#fff}
.pg-fest .foot{color:#d9c3cf;border-color:#5a2a44}
.fest-ph{position:absolute;left:0;right:0;top:0;height:40%;border-radius:0}
.fest-ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#1d0f1700 40%,#1d0f17)}
.fest-pad{top:30%}
.fest-k{color:#F3D98A;font-weight:700;font-size:calc(1.9cqw*var(--k,1));margin:0}
.fest-t{font-size:calc(8.4cqw*var(--k,1));font-weight:800;line-height:1;margin:.6cqw 0 .4cqw}
.fest-t .fp{color:var(--f);display:block}
.fest-s{font-size:calc(2.3cqw*var(--k,1));margin:0 0 2.6cqw;color:#F3D98A}
.pg-fest .txt{color:#f1e4eb}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:1.4cqw 3cqw;margin-top:2.4cqw}
.fd{border-top:.2cqw solid #5a2a44;padding-top:1cqw}
.fd b{display:block;font-size:calc(1.4cqw*var(--k,1));color:#F3D98A;font-weight:600}
.fd span{font-size:calc(2cqw*var(--k,1));font-weight:700}
.fest-nina{position:absolute;right:-2cqw;bottom:6cqw;width:26cqw;height:26cqw;background:transparent center/contain no-repeat;border-radius:0}

/* por qué */
.why{display:grid;grid-template-columns:1fr 1fr;gap:2.6cqw 3.4cqw;margin-top:1cqw}.why .w:first-child{grid-column:1/-1}
.w{display:grid;grid-template-columns:5.4cqw 1fr;gap:2cqw;align-items:start}
.w .n{width:5.4cqw;height:5.4cqw;border-radius:50%;background:var(--f);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(2.4cqw*var(--k,1))}
.w h6{margin:0 0 .3cqw;font-size:calc(2cqw*var(--k,1));color:var(--f2)}
.w p{margin:0;text-align:justify;font-size:calc(1.62cqw*var(--k,1))}
.why-ph{height:40cqw;margin-top:3cqw}

/* planes */
.plan{border:.25cqw solid var(--rosa2);border-radius:2cqw;padding:2.2cqw 2.6cqw;background:#fff;position:relative}
.plan.ptop{background:linear-gradient(135deg,var(--f),var(--f2));color:#fff;border:0}
.plan h5{margin:0;font-size:calc(2.6cqw*var(--k,1));font-weight:800;color:var(--f);line-height:1.1}
.plan.ptop h5{color:#fff}
.plan .cup{display:inline-block;font-size:calc(1.3cqw*var(--k,1));font-weight:700;background:var(--rosa);color:var(--f2);padding:.3cqw 1.4cqw;border-radius:3cqw;margin:.8cqw 0}
.plan.ptop .cup{background:#ffffff30;color:#fff}
.plan .pr{font-size:calc(3.1cqw*var(--k,1));font-weight:800;margin:.2cqw 0 1cqw;white-space:nowrap}
.plan .pr small{font-size:calc(1.5cqw*var(--k,1));font-weight:600;opacity:.8}
.plan .ul{font-size:calc(1.56cqw*var(--k,1));line-height:1.38}
.plan.ptop .ul li::before{background:#fff}
.plan.ptop .ul{columns:2;column-gap:3cqw}
.plan.ptop .ul li{break-inside:avoid}
.p3{display:grid;grid-template-columns:repeat(3,1fr);gap:2cqw;margin-top:2cqw;align-items:start}
.p2{display:grid;grid-template-columns:repeat(2,1fr);gap:2cqw;margin-top:2cqw;align-items:start}
.lead{font-size:calc(1.75cqw*var(--k,1));margin:0 0 2cqw;color:var(--gris)}
.strip{margin-top:2cqw;background:var(--rosa);border-radius:2cqw;padding:2cqw 2.6cqw}
.strip h6{margin:0 0 1cqw;font-size:calc(2cqw*var(--k,1));color:var(--f2)}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:.8cqw 3cqw;font-size:calc(1.4cqw*var(--k,1));line-height:1.35}
.pgrid b{color:var(--f2)}
.note{margin-top:2cqw;display:flex;gap:1.6cqw;flex-wrap:wrap}
.note div{flex:1 1 30%;border-left:.6cqw solid var(--oro);background:#FBF6EA;padding:1.2cqw 1.8cqw;border-radius:0 1.2cqw 1.2cqw 0;font-size:calc(1.5cqw*var(--k,1));font-weight:500}

/* canje */
.rgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4cqw;margin:1.6cqw 0 1.6cqw}
.rb{background:var(--rosa);border-radius:1.6cqw;padding:1.8cqw}
.rb h6{margin:0 0 .4cqw;font-size:calc(1.75cqw*var(--k,1));color:var(--f2);line-height:1.2}
.rb p{margin:0;font-size:calc(1.35cqw*var(--k,1));line-height:1.3}
.cj{display:grid;grid-template-columns:1fr 28cqw;gap:4cqw;align-items:start}
.cj .ph{height:44cqw}
.cj .ul{font-size:calc(1.5cqw*var(--k,1))}
.ex{margin-top:2.4cqw;border:.25cqw dashed var(--f);border-radius:1.6cqw;padding:1.6cqw 2.2cqw;font-size:calc(1.55cqw*var(--k,1))}
.ex b{color:var(--f2)}

/* propuesta */
.pp-h{position:absolute;left:0;right:0;top:0;height:18cqw;background:linear-gradient(135deg,var(--f),var(--f2));color:#fff;padding:4.4cqw 7cqw 0}
.pp-h h2{margin:0;font-size:calc(5cqw*var(--k,1));font-weight:800;line-height:1}
.pp-h p{margin:.8cqw 0 0;font-size:calc(2cqw*var(--k,1));font-weight:500}
.pp-h img{position:absolute;right:7cqw;top:2.6cqw;height:13cqw}
.pp-pad{top:21.5cqw}
.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4cqw;margin-bottom:2.2cqw}
.meta div{border-bottom:.2cqw solid var(--rosa2);padding-bottom:.6cqw}
.meta b{display:block;font-size:calc(1.3cqw*var(--k,1));color:var(--gris);font-weight:600}
.meta span{font-weight:700;font-size:calc(1.7cqw*var(--k,1))}
.h6{margin:2cqw 0 .8cqw;font-size:calc(2cqw*var(--k,1));color:var(--f2);font-weight:700}
.pp-items{columns:2;column-gap:3.4cqw;font-size:calc(1.55cqw*var(--k,1))}
.pg-prop .txt{font-size:calc(1.62cqw*var(--k,1));margin-bottom:1cqw}.pg-prop .ul{font-size:calc(1.55cqw*var(--k,1))}.pg-prop .ul li{margin:.35cqw 0}.pg-prop .h6{margin:1.6cqw 0 .6cqw}

function aplicarPlan() {
  const p = S.doc.prop, arr = p.tipo === 'festival' ? S.doc.planesF : S.doc.planesA;
  const pl = arr[p.plan] || arr[0]; if (!pl) return;
  const ev = p.tipo === 'festival' ? 'Festival ' + S.doc.t.festT1 : 'Temporada ' + new Date().getFullYear();
  const precio = p.tipo === 'festival' ? +pl.p : (+pl.p) * (+p.meses || 12);
  p.planN = `${pl.n} · ${ev}`;
  p.items = pl.items.map(x => x.replace(/tu marca/g, '{cliente}'));
  const base = `Auspicio ${pl.n} — ${ev}${p.tipo === 'anual' ? ` (${p.meses} meses)` : ''}`;
  const det = p.canjeDet || 'detallar productos o servicios, cantidades y valor';
  if (p.modal === 'Efectivo') p.rows = [{ c: base, t: 'Efectivo', m: precio }];
  else if (p.modal === 'Canje') p.rows = [{ c: base + ' · Canje: ' + det, t: 'Canje', m: precio }];
  else { const cj = Math.round(precio * (+p.pct || 50) / 100 / 1000) * 1000; p.rows = [{ c: base + ' · aporte en efectivo', t: 'Efectivo', m: precio - cj }, { c: 'Canje: ' + det, t: 'Canje', m: cj }]; }
  p.pago = p.tipo === 'festival'
    ? (p.modal === 'Canje' ? 'Entrega de los productos o prestación de los servicios hasta 15 días antes del festival, según el detalle acordado.' : '50% a la firma del acuerdo y 50% hasta 15 días antes del festival. Transferencia bancaria o depósito; emitimos factura legal.' + (p.modal === 'Mixto' ? ' El canje se entrega hasta 15 días antes del festival.' : ''))
    : (p.modal === 'Canje' ? `Entregas de productos o servicios distribuidas durante los ${p.meses} meses, según calendario acordado.` : `${p.meses} cuotas mensuales del 1 al 10 de cada mes, o pago único anticipado con 10% de descuento. Transferencia bancaria o depósito; emitimos factura legal.`);
  dirty(); render();
  toast('Plan aplicado a la propuesta');
}

      <div class="row2"><label class="field"><span>Auspicio</span><select data-f="prop.tipo"><option value="festival"${p.tipo === 'festival' ? ' selected' : ''}>Festival</option><option value="anual"${p.tipo === 'anual' ? ' selected' : ''}>Temporada</option></select></label>
      <label class="field"><span>Modalidad</span><select data-f="prop.modal">${['Efectivo', 'Canje', 'Mixto'].map(m => `<option${p.modal === m ? ' selected' : ''}>${m}</option>`).join('')}</select></label></div>
      <label class="field"><span>Plan</span><select data-f="prop.plan">${plans}</select></label>
      <div class="row2">${p.modal === 'Mixto' ? `<label class="field"><span>% en canje</span><input type="number" min="0" max="100" step="5" data-f="prop.pct" value="${esc(p.pct)}"></label>` : ''}
      ${p.tipo === 'anual' ? `<label class="field"><span>Meses</span><input type="number" min="1" max="24" data-f="prop.meses" value="${esc(p.meses)}"></label>` : ''}</div>
      ${p.modal !== 'Efectivo' ? `<label class="field"><span>¿Qué entrega en canje?</span><textarea rows="2" data-f="prop.canjeDet" placeholder="Ej.: 30 mallas de competencia">${esc(p.canjeDet)}</textarea></label>` : ''}
      <button class="btn p" data-a="apply" style="width:100%;justify-content:center">Aplicar plan a la propuesta</button>
      <p class="hint">Completa beneficios, montos y forma de pago. Después podés retocar todo en la hoja.</p>
      <h4>Hojas</h4>
      ${Object.entries(PAGES).map(([k, v]) => `<label class="chk"><input type="checkbox" data-h="${k}"${d.hojas[k] ? ' checked' : ''}> ${v.n}</label>`).join('')}
      <h4>WhatsApp de la academia</h4>
      <label class="field"><span>Recibe los «Me interesa» del cliente</span><input data-f="waAcad" value="${esc(d.waAcad)}" inputmode="tel"></label>
    </aside>
    <main class="pages" id="pages">${sheets()}</main>
  </div>`;
  afterSheets();
}

function sheets() {
  return Object.entries(PAGES).map(([k, v]) => `<section class="sheet pg-${k}${S.doc.hojas[k] ? '' : ' off'}" data-k="${k}">${v.h()}</section>`).join('');
}
function afterSheets() {
  // numeración real según hojas visibles
  let n = 0;
  document.querySelectorAll('.sheet').forEach(s => { if (!s.classList.contains('off')) { n++; const f = s.querySelector('.foot span:last-child'); if (f) f.textContent = 'Página ' + n; } });
  // QR al WhatsApp de la academia
  const q = $('#qr');
  if (q && window.QRCode) { q.innerHTML = ''; try { new QRCode(q, { text: 'https://wa.me/' + waNum(S.doc.waAcad) + '?text=' + encodeURIComponent('Hola APAMA, me interesa auspiciar.'), width: 256, height: 256, colorDark: '#2A1621', correctLevel: QRCode.CorrectLevel.M }); } catch (e) {} }
  else if (q) q.style.display = 'none';
  ajustar();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajustar);
}
/* achica la letra de cada hoja hasta que el contenido entre */
function ajustar() {
  const pg = document.querySelector('.pages'); if (!pg) return;
  pg.classList.add('measure');
  pg.querySelectorAll('.sheet:not(.off)').forEach(s => {
    const pad = s.querySelector('.pad'); if (!pad) return;
    let k = 1; s.style.setProperty('--k', k);
    while (pad.scrollHeight > pad.clientHeight + 1 && k > 0.72) { k = +(k - 0.03).toFixed(2); s.style.setProperty('--k', k); }
    s.classList.toggle('over', ED && pad.scrollHeight > pad.clientHeight + 1);
  });
  pg.classList.remove('measure');
}

function renderClient(app) {
  ED = false;
  app.innerHTML = `${S.preview ? `<div class="top">${brand('Así lo ve el cliente')}<button class="btn" data-a="exitprev">← Volver al editor</button></div>` : ''}
  <div class="view"><main class="pages">${sheets()}</main>
  <div class="cbar"><button class="btn" data-a="pdf">Descargar PDF</button><a class="btn wa" href="https://wa.me/${waNum(S.doc.waAcad)}?text=${encodeURIComponent('Hola APAMA, vi la propuesta de auspicio' + (S.doc.cliente.nombre ? ' para ' + S.doc.cliente.nombre : '') + ' y me interesa.')}" target="_blank" rel="noopener">Me interesa · WhatsApp</a></div></div>`;
  afterSheets();
}

/* ---------------- ACCIONES ---------------- */
const waNum = n => { let s = String(n || '').replace(/\D/g, ''); if (s.startsWith('0')) s = '595' + s.slice(1); return s; };
const linkDe = id => location.origin + location.pathname + '?p=' + encodeURIComponent(id);
function dirty() { S.dirty = true; const b = document.querySelector('[data-a="save"]'); if (b) b.textContent = 'Guardar •'; }

async function nueva() {
  let base = clone(DEF);
  try { const r = await api('tpl'); if (r.doc) base = deepFill(r.doc, clone(DEF)); } catch (e) {}
  base.id = ''; base.vistas = 0; base.ultima = ''; base.cliente = clone(DEF.cliente); base.cliente.fecha = today();
  S.doc = base; S.isTpl = false; S.dirty = true; S.view = 'edit';
  if (!S.doc.prop.rows.length) { aplicarPlan(); S.dirty = true; } else render();
}
async function abrir(id) {
  const r = await api('get', { id, preview: true });
  if (!r.ok) return toast('No se encontró la propuesta');
  S.doc = deepFill(r.doc, clone(DEF)); S.isTpl = false; S.dirty = false; S.view = 'edit'; render(); scrollTo(0, 0);
}
async function guardar() {
  sync();
  if (S.isTpl) { await api('saveTpl', { doc: S.doc }); S.dirty = false; toast('Plantilla guardada'); render(); return; }
  if (!S.doc.cliente.nombre.trim()) { toast('Escribí el nombre del destinatario'); $('[data-f="cliente.nombre"]')?.focus(); return false; }
  const r = await api('save', { doc: S.doc });
  S.doc.id = r.id; S.dirty = false; toast('Propuesta guardada'); render(); return true;
}
function sync() { document.querySelectorAll('[data-p][contenteditable]').forEach(el => setP(S.doc, el.dataset.p, el.innerText.replace(/\n$/, ''))); }

async function asegurarGuardado() { if (S.dirty || !S.doc.id) { const ok = await guardar(); if (ok === false) return false; } return true; }
function msgWA(doc, link) {
  const quien = doc.cliente.contacto || doc.cliente.nombre;
  return `Hola ${quien}! Te comparto la propuesta de auspicio de APAMA – Academia de Patinaje Artístico Marta Arias${doc.prop?.planN ? ' (' + doc.prop.planN + ')' : ''}.\n\nLa podés ver y descargar acá:\n${link}\n\nQuedamos atentas a cualquier consulta. ¡Gracias!`;
}
function abrirWA(num, txt) {
  const url = 'https://wa.me/' + waNum(num) + '?text=' + encodeURIComponent(txt);
  const a = document.createElement('a'); a.href = url; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
  modal(`<h3>Enviar por WhatsApp</h3><p>Si WhatsApp no se abrió solo, tocá el botón:</p><a class="btn wa" href="${esc(url)}" target="_blank" rel="noopener">Abrir WhatsApp</a><div class="mrow"><button class="btn" data-close>Cerrar</button></div>`);
}
async function copiar(link) {
  modal(`<h3>Enlace de la propuesta</h3><input class="linkbox" readonly value="${esc(link)}" onclick="this.select()">${API_URL ? '' : '<p class="hint">En modo demo este enlace solo funciona en este navegador. Conectado al Google Sheet, lo abre cualquiera.</p>'}<div class="mrow"><button class="btn" data-close>Cerrar</button><button class="btn p" id="cpy">Copiar</button></div>`);
  $('#cpy').onclick = async () => { try { await navigator.clipboard.writeText(link); toast('Enlace copiado'); } catch (e) { $('.linkbox').select(); toast('Seleccionado: copiá con Ctrl+C'); } };
}
function pdf() {
  sync();
  const t = document.title; document.title = 'Propuesta APAMA - ' + (S.doc.cliente.nombre || 'auspicio');
  ajustar();
  try { window.print(); } catch (e) {}
  document.title = t;
  setTimeout(() => toast('Elegí «Guardar como PDF» en la ventana de impresión'), 300);
}

/* modal propio (sin alert/confirm) */
function modal(html) { const m = document.createElement('div'); m.className = 'mdl'; m.innerHTML = `<div>${html}</div>`; m.onclick = e => { if (e.target === m || e.target.closest('[data-close]')) m.remove(); }; document.body.appendChild(m); return m; }
function confirmar(txt, ok) { const m = modal(`<h3>¿Seguro?</h3><p>${esc(txt)}</p><div class="mrow"><button class="btn" data-close>Cancelar</button><button class="btn p" id="okb">Sí, continuar</button></div>`); m.querySelector('#okb').onclick = () => { m.remove(); ok(); }; }

/* imágenes */
async function elegirImagen(path) {
  let gal = [];
  try { gal = (await api('gallery')).items || []; } catch (e) {}
  const all = [...gal, ...IMGS];
  const m = modal(`<h3>Cambiar foto</h3><label class="btn p">Subir desde el celular o la compu<input type="file" accept="image/*" id="fi" hidden></label>
    <p class="hint">O elegí una de la galería:</p><div class="gal">${all.map(u => `<button data-u="${esc(u)}" style="background-image:url('${esc(u)}')" aria-label="Elegir foto"></button>`).join('')}</div><div class="mrow"><button class="btn" data-close>Cancelar</button></div>`);
  m.querySelectorAll('[data-u]').forEach(b => b.onclick = () => { setP(S.doc, path, b.dataset.u); m.remove(); dirty(); sync(); refresh(); });
  m.querySelector('#fi').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    toast('Subiendo foto…');
    const data = await reducir(f, 1600, .82);
    try { const r = await api('upload', { data, name: f.name }); setP(S.doc, path, r.url); m.remove(); dirty(); sync(); refresh(); toast('Foto lista'); } catch (err) { toast('No se pudo subir la foto'); }
  };
}
function reducir(file, max, q) {
  return new Promise(res => { const img = new Image(); img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', q)); URL.revokeObjectURL(img.src); }; img.src = URL.createObjectURL(file); });
}
function refresh() { const y = scrollY; $('#pages').innerHTML = sheets(); afterSheets(); scrollTo(0, y); }

/* ---------------- EVENTOS ---------------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-a],[data-img],[data-add],[data-addplan]'); if (!b) return;
  const a = b.dataset.a, id = b.dataset.id;
  try {
    if (b.dataset.img) return elegirImagen(b.dataset.img);
    if (b.dataset.add) { sync(); const arr = getP(S.doc, b.dataset.add); const s = arr[0]; arr.push(typeof s === 'string' || s === undefined ? '' : Object.fromEntries(Object.keys(s).map(k => [k, k === 'img' ? 'img/staff.jpg' : k === 'm' ? 0 : k === 't' && b.dataset.add === 'prop.rows' ? 'Efectivo' : '']))); dirty(); return refresh(); }
    if (b.dataset.addplan) { sync(); S.doc[b.dataset.addplan].push({ n: 'Nuevo plan', cup: 'Cupos', p: 0, items: ['Beneficio'] }); dirty(); return refresh(); }
    if (a === 'new') return nueva();
    if (a === 'tpl') { let base = clone(DEF); try { const r = await api('tpl'); if (r.doc) base = deepFill(r.doc, clone(DEF)); } catch (e) {} S.doc = base; S.isTpl = true; S.dirty = false; S.view = 'edit'; if (!S.doc.prop.rows.length) aplicarPlan(); else render(); return; }
    if (a === 'open') return abrir(id);
    if (a === 'back') { if (S.dirty) return confirmar('Hay cambios sin guardar. ¿Salir igual?', goHome); return goHome(); }
    if (a === 'save') return guardar();
    if (a === 'apply') { sync(); return aplicarPlan(); }
    if (a === 'preview') { sync(); S.preview = true; S.view = 'client'; render(); return scrollTo(0, 0); }
    if (a === 'exitprev') { S.preview = false; S.view = 'edit'; render(); return scrollTo(0, 0); }
    if (a === 'pdf') return pdf();
    if (a === 'link') { if (id) return copiar(linkDe(id)); if (await asegurarGuardado() === false) return; return copiar(linkDe(S.doc.id)); }
    if (a === 'wa') {
      if (id) { const x = S.list.find(z => z.id === id); const r = await api('get', { id, preview: true }); return abrirWA(x?.wa || '', msgWA(r.doc, linkDe(id))); }
      if (await asegurarGuardado() === false) return;
      if (!S.doc.cliente.wa) toast('Sin WhatsApp cargado: elegí el contacto en WhatsApp');
      return abrirWA(S.doc.cliente.wa, msgWA(S.doc, linkDe(S.doc.id)));
    }
    if (a === 'dup') { const r = await api('get', { id, preview: true }); const d = deepFill(r.doc, clone(DEF)); d.id = ''; d.vistas = 0; d.ultima = ''; d.cliente.nombre += ' (copia)'; d.cliente.fecha = today(); S.doc = d; S.isTpl = false; S.dirty = true; S.view = 'edit'; render(); return toast('Copia creada: cambiá el destinatario y guardá'); }
    if (a === 'delp') return confirmar('Se elimina la propuesta y su enlace deja de funcionar.', async () => { await api('del', { id }); toast('Eliminada'); goHome(); });
  } catch (err) { console.error(err); toast('Algo falló: ' + err.message); }
});
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-del]'); if (!b) return;
  e.preventDefault(); sync(); getP(S.doc, b.dataset.del).splice(+b.dataset.i, 1); dirty(); refresh();
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.p && t.isContentEditable) { setP(S.doc, t.dataset.p, t.innerText.replace(/\n$/, '')); dirty(); clearTimeout(t._o); t._o = setTimeout(ajustar, 400); return; }
  if (t.dataset.num) { const v = parseInt(t.innerText.replace(/\D/g, '')) || 0; setP(S.doc, t.dataset.num, v); dirty(); updTot(); return; }
});
document.addEventListener('focusout', e => { const t = e.target; if (t.dataset?.num) t.innerText = String(getP(S.doc, t.dataset.num) || 0).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); if (t.dataset?.p && t.closest('.pg-datos')) refresh(); });
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.f) {
    sync();
    let v = t.value; if (t.type === 'number') v = +v;
    if (t.dataset.f === 'prop.plan') v = +v;
    setP(S.doc, t.dataset.f, v);
    if (t.dataset.f === 'modo') { const h = S.doc.hojas; h.planF = v !== 'anual' ? 1 : 0; h.planA = v !== 'festival' ? 1 : 0; S.doc.prop.tipo = v === 'anual' ? 'anual' : 'festival'; S.doc.prop.plan = Math.min(S.doc.prop.plan, (S.doc.prop.tipo === 'festival' ? S.doc.planesF : S.doc.planesA).length - 1); }
    if (t.dataset.f === 'prop.tipo') S.doc.prop.plan = Math.min(+S.doc.prop.plan, (v === 'festival' ? S.doc.planesF : S.doc.planesA).length - 1);
    dirty(); renderEditor($('#app')); return;
  }
  if (t.dataset.h) { sync(); S.doc.hojas[t.dataset.h] = t.checked ? 1 : 0; dirty(); refresh(); return; }
  if (t.dataset.sel) { sync(); setP(S.doc, t.dataset.sel, t.value); dirty(); refresh(); }
});
document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 's' && S.view === 'edit') { e.preventDefault(); guardar(); } });
window.addEventListener('beforeunload', e => { if (S.dirty && S.view === 'edit') { e.preventDefault(); e.returnValue = ''; } });
function updTot() {
  const T = totales(S.doc);
  document.querySelectorAll('[data-tot]').forEach(el => el.textContent = gs(T[el.dataset.tot]));
  const c = document.querySelector('[data-cuota]'); const p = S.doc.prop;
  if (c) c.textContent = `Equivale a ${p.meses} cuotas mensuales de ${gs(T.ef / p.meses)} en efectivo${T.cj ? ' + canje acordado' : ''}.`;
}

/* ---------------- INICIO ---------------- */
(async () => {
  const qs = new URLSearchParams(location.search);
  const pid = qs.get('p');
  if (pid) {
    S.view = 'client';
    $('#app').innerHTML = '<div class="wrap" style="text-align:center;padding-top:30vh;color:#C10F68;font-weight:700">Cargando propuesta…</div>';
    try { const r = await api('get', { id: pid, preview: qs.has('preview') }); if (!r.ok) throw 0; S.doc = deepFill(r.doc, clone(DEF)); document.title = 'Propuesta de auspicio APAMA' + (S.doc.cliente.nombre ? ' · ' + S.doc.cliente.nombre : ''); render(); }
    catch (e) { $('#app').innerHTML = '<div class="wrap" style="text-align:center;padding-top:30vh">Esta propuesta no está disponible.</div>'; }
    return;
  }
  if (API_URL) { try { S.clave = sessionStorage.getItem('apama_k') || ''; } catch (e) {} if (!S.clave) { S.view = 'login'; return render(); } }
  goHome();
})();
}
</script>
